<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БЛiК — Учет и Мониторинг</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #4a5568;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent-color: #3182ce;
            --accent-hover: #2b6cb0;
            --reset-color: #e53e3e;
            --reset-hover: #c53030;
            --input-bg: #e0e5ec;
            --alert-bg: #fff5f5;
            --alert-text: #e53e3e;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --shadow-light: #2d3748;
            --shadow-dark: #0f141c;
            --accent-color: #63b3ed;
            --accent-hover: #4299e1;
            --reset-color: #fc8181;
            --reset-hover: #f56565;
            --input-bg: #1a202c;
            --alert-bg: #2d3748;
            --alert-text: #fc8181;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-transform: uppercase;
            position: relative;
            overflow-x: hidden;
        }

        /* ФОНОВЫЙ ВОДЯНОЙ ЗНАК БЛiК */
        .background-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20vw;
            font-weight: 900;
            color: var(--text-color);
            opacity: 0.03;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 15px;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        /* ГЛАВНОЕ МЕНЮ РАЗДЕЛОВ */
        .main-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .main-nav-btn {
            flex: 1;
            padding: 12px 10px;
            background-color: var(--bg-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            color: var(--text-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }

        .main-nav-btn:active, .main-nav-btn.active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-color);
        }

        /* ОСНОВНАЯ КАРТОЧКА */
        .container {
            background-color: var(--bg-color);
            padding: 25px;
            padding-bottom: 45px;
            border-radius: 20px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            width: 100%;
            position: relative;
        }

        .tab-section {
            display: none;
        }

        .tab-section.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
        }

        /* КНОПКА ТЕМЫ КАК НА СКРИНШОТЕ */
        .theme-toggle-btn {
            background: var(--bg-color);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .theme-toggle-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        /* УВЕДОМЛЕНИЕ О ТО */
        .alert-banner {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            background-color: var(--alert-bg);
            color: var(--alert-text);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            display: none;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--bg-color);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            color: var(--text-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .mode-btn.active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            outline: none;
            text-transform: uppercase;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .action-btns {
            margin-top: 15px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--reset-color);
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }

        .reset-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .calc-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            margin-bottom: 15px;
        }

        .calc-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            display: none;
        }

        .result-box h3 {
            margin-top: 0;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .result-item {
            margin: 8px 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .highlight {
            font-weight: bold;
            color: var(--accent-color);
        }

        .highlight-alert {
            font-weight: bold;
            color: var(--reset-color);
        }

        /* 3D ВОДЯНОЙ ЗНАК В УГЛУ КАРТОЧКИ */
        .watermark-3d {
            position: absolute;
            bottom: 12px;
            left: 15px;
            padding: 5px 12px;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ФОНОВЫЙ ВОДЯНОЙ ЗНАК -->
    <div class="background-watermark">БЛiК</div>

    <div class="main-wrapper">
        <!-- МЕНЮ РАЗДЕЛОВ -->
        <div class="main-nav">
            <button class="main-nav-btn active" onclick="switchMainTab('tabHours', this)">МОТОЧАСЫ, Т/О</button>
            <button class="main-nav-btn" onclick="switchMainTab('tabFuel', this)">РАСХОД ТОПЛИВА</button>
        </div>

        <div class="container">
            
            <!-- РАЗДЕЛ 1: МОТОЧАСЫ, Т/О -->
            <div id="tabHours" class="tab-section active">
                <div class="header">
                    <h2>ПОДСЧЁТ МОТОЧАСОВ</h2>
                    <button class="theme-toggle-btn" id="themeIcon" onclick="toggleTheme()">🌙</button>
                </div>

                <div id="alertBanner" class="alert-banner"></div>

                <div class="mode-selector">
                    <button class="mode-btn active" id="btnModeDays" onclick="setMode('days')">ПО ДНЯМ</button>
                    <button class="mode-btn" id="btnModeDate" onclick="setMode('date')">ПО ДАТЕ ТО</button>
                </div>

                <div id="sectionDays">
                    <div class="input-group">
                        <label for="days">КОЛИЧЕСТВО ДНЕЙ РАБОТЫ:</label>
                        <input type="number" id="days" placeholder="НАПР. 5" min="0" oninput="autoCalculate()">
                    </div>
                </div>

                <div id="sectionDate" style="display: none;">
                    <div class="input-group">
                        <label for="lastDate">ДАТА ПОСЛЕДНЕГО ТО:</label>
                        <input type="date" id="lastDate" onchange="autoCalculate()">
                    </div>
                </div>

                <div class="input-group">
                    <label>ВРЕМЯ РАБОТЫ В ДЕНЬ:</label>
                    <div class="time-inputs">
                        <input type="number" id="hours" placeholder="ЧАСОВ (0-24)" min="0" max="24" oninput="autoCalculate()">
                        <input type="number" id="minutes" placeholder="МИНУТ (0-59)" min="0" max="59" oninput="autoCalculate()">
                    </div>
                </div>

                <div class="input-group">
                    <label for="targetHours">КОЛ-ВО М/Ч ДО СЛЕД. ТО:</label>
                    <input type="number" id="targetHours" placeholder="50" min="1" value="50" oninput="autoCalculate()">
                </div>

                <div class="action-btns">
                    <button class="reset-btn" onclick="clearData()">ОЧИСТИТЬ</button>
                </div>

                <div class="result-box" id="result">
                    <h3>РЕЗУЛЬТАТ:</h3>
                    <div class="result-item" id="lastServiceDisplay"></div>
                    <div class="result-item" id="daysPassed"></div>
                    <div class="result-item" id="totalTime"></div>
                    <div class="result-item" id="totalDecimal"></div>
                    <div class="result-item" id="equivalentDays"></div>
                    <div class="result-item" id="nextServiceDate"></div>
                </div>
            </div>

            <!-- РАЗДЕЛ 2: РАСХОД ТОПЛИВА -->
            <div id="tabFuel" class="tab-section">
                <div class="header">
                    <h2>РАСХОД ТОПЛИВА</h2>
                    <button class="theme-toggle-btn" id="themeIconFuel" onclick="toggleTheme()">🌙</button>
                </div>
                <div class="input-group">
                    <label for="fuelStartDate">С ДАТЫ:</label>
                    <input type="date" id="fuelStartDate" onchange="calcFuel()">
                </div>
                <div class="input-group">
                    <label for="fuelEndDate">ПО ТЕКУЩУЮ:</label>
                    <input type="date" id="fuelEndDate" onchange="calcFuel()">
                </div>
                <div class="input-group">
                    <label for="fuelLitersDay">ЛИТРОВ В ДЕНЬ:</label>
                    <input type="number" id="fuelLitersDay" value="7" oninput="calcFuel()">
                </div>
                <button class="calc-btn" onclick="calcFuel()">РАССЧИТАТЬ</button>
                
                <div class="result-box" id="fuelResultBox" style="display: block;">
                    <h3>РЕЗУЛЬТАТ:</h3>
                    <div class="result-item">ИТОГО РАСХОД: <span id="fuelTotalRes" class="highlight">-</span> Л</div>
                    <div class="result-item">ПЕРИОД: <span id="fuelPeriodRes" class="highlight">-</span> ДН.</div>
                </div>
            </div>

            <!-- 3D ВОДЯНОЙ ЗНАК БЛИК -->
            <div class="watermark-3d">БЛiК</div>
        </div>
    </div>

    <script>
        let currentMode = 'days';

        window.onload = function() {
            loadSavedData();
            autoCalculate();
            
            document.getElementById('fuelEndDate').valueAsDate = new Date();
            const fStart = new Date();
            fStart.setDate(fStart.getDate() - 5);
            document.getElementById('fuelStartDate').valueAsDate = fStart;
            calcFuel();
        };

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            
            const icon = next === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeIcon').innerText = icon;
            document.getElementById('themeIconFuel').innerText = icon;
            
            localStorage.setItem('app_theme', next);
        }

        // Загрузка сохраненной темы при старте
        const savedTheme = localStorage.getItem('app_theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = savedTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeIcon').innerText = icon;
            document.getElementById('themeIconFuel').innerText = icon;
        }

        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.main-nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeDays').classList.toggle('active', mode === 'days');
            document.getElementById('btnModeDate').classList.toggle('active', mode === 'date');
            document.getElementById('sectionDays').style.display = mode === 'days' ? 'block' : 'none';
            document.getElementById('sectionDate').style.display = mode === 'date' ? 'block' : 'none';
            autoCalculate();
        }

        function formatDate(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}.${month}.${year}`;
        }

        function autoCalculate() {
            let totalDays = 0;
            let startDate = null;

            const hours = parseInt(document.getElementById('hours').value) || 0;
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const targetHours = parseFloat(document.getElementById('targetHours').value) || 50;

            const dailyMinutes = (hours * 60) + minutes;
            const banner = document.getElementById('alertBanner');

            if (dailyMinutes === 0 || hours > 24 || minutes >= 60 || targetHours <= 0) {
                document.getElementById('result').style.display = 'none';
                banner.style.display = 'none';
                saveData();
                return;
            }

            if (currentMode === 'days') {
                totalDays = parseInt(document.getElementById('days').value) || 0;
                startDate = new Date();
                startDate.setDate(startDate.getDate() - totalDays);
            } else {
                const dateVal = document.getElementById('lastDate').value;
                if (!dateVal) {
                    document.getElementById('result').style.display = 'none';
                    banner.style.display = 'none';
                    saveData();
                    return;
                }
                startDate = new Date(dateVal);
                const today = new Date();
                
                startDate.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);

                const diffTime = today - startDate;
                totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (totalDays < 0) {
                    document.getElementById('result').style.display = 'none';
                    banner.style.display = 'none';
                    saveData();
                    return;
                }
            }

            const totalMinutes = dailyMinutes * totalDays;
            const resHours = Math.floor(totalMinutes / 60);
            const resMinutes = totalMinutes % 60;
            const decimalHours = (totalMinutes / 60).toFixed(2);

            const continuousDays = Math.floor(resHours / 24);
            const remainingHours = resHours % 24;

            const dailyHours = dailyMinutes / 60;
            const daysNeededForTarget = Math.ceil(targetHours / dailyHours);

            const nextServiceDateObj = new Date(startDate);
            nextServiceDateObj.setDate(nextServiceDateObj.getDate() + daysNeededForTarget);

            const todayTime = new Date();
            todayTime.setHours(0, 0, 0, 0);
            nextServiceDateObj.setHours(0, 0, 0, 0);
            
            const diffTimeRemaining = nextServiceDateObj - todayTime;
            const daysRemaining = Math.round(diffTimeRemaining / (1000 * 60 * 60 * 24));

            if (daysRemaining < 0) {
                banner.innerHTML = `⚠️ ВНИМАНИЕ! СРОК ТО ПРОШЕЛ СВЫШЕ ${targetHours} М/Ч!`;
                banner.style.display = "block";
            } else if (daysRemaining === 0) {
                banner.innerHTML = `🚨 ВНИМАНИЕ! СЕГОДНЯ СРОК ПРОВЕДЕНИЯ ТО!`;
                banner.style.display = "block";
            } else if (daysRemaining === 1) {
                banner.innerHTML = `⚠️ ПРЕДУПРЕЖДЕНИЕ: ДО СЛЕДУЮЩЕГО ТО ОСТАЛСЯ 1 ДЕНЬ!`;
                banner.style.display = "block";
            } else if (daysRemaining === 2) {
                banner.innerHTML = `⚠️ ПРЕДУПРЕЖДЕНИЕ: ДО СЛЕДУЮЩЕГО ТО ОСТАЛОСЬ 2 ДНЯ!`;
                banner.style.display = "block";
            } else {
                banner.style.display = "none";
            }

            document.getElementById('lastServiceDisplay').innerHTML = 
                `ДАТА ПОСЛЕДНЕГО ТО: <span class="highlight">${formatDate(startDate)}</span>`;

            document.getElementById('daysPassed').innerHTML = 
                `ПРОШЛО ДНЕЙ: <span class="highlight">${totalDays} ДН.</span>`;

            document.getElementById('totalTime').innerHTML = 
                `ОБЩАЯ НАРАБОТКА: <span class="highlight">${resHours} Ч ${resMinutes} МИН</span>`;
            
            document.getElementById('totalDecimal').innerHTML = 
                `В ДЕСЯТИЧНОМ ВИДЕ: <span class="highlight">${decimalHours} МОТОЧАСОВ</span>`;

            document.getElementById('equivalentDays').innerHTML = 
                `НЕПРЕРЫВНАЯ РАБОТА: <span class="highlight">${continuousDays} ДН. ${remainingHours} Ч ${resMinutes} МИН</span>`;

            const isOverdue = resHours >= targetHours;
            const nextServiceClass = isOverdue ? 'highlight-alert' : 'highlight';
            const statusText = isOverdue ? ' (ТРЕБУЕТСЯ ТО!)' : '';

            document.getElementById('nextServiceDate').innerHTML = 
                `СЛЕДУЮЩЕЕ ТО (${targetHours} Ч): <span class="${nextServiceClass}">${formatDate(nextServiceDateObj)}${statusText}</span>`;

            document.getElementById('result').style.display = 'block';

            saveData();
        }

        function calcFuel() {
            const start = new Date(document.getElementById('fuelStartDate').value);
            const end = new Date(document.getElementById('fuelEndDate').value);
            const liters = parseFloat(document.getElementById('fuelLitersDay').value) || 0;
            if (start && end && end >= start) {
                const days = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('fuelTotalRes').innerText = days * liters;
                document.getElementById('fuelPeriodRes').innerText = days;
            }
        }

        function clearData() {
            document.getElementById('days').value = '';
            document.getElementById('lastDate').value = '';
            document.getElementById('hours').value = '';
            document.getElementById('minutes').value = '';
            document.getElementById('targetHours').value = '50';
            document.getElementById('result').style.display = 'none';
            document.getElementById('alertBanner').style.display = 'none';

            localStorage.removeItem('generator_neumo_data');
        }

        function saveData() {
            const data = {
                mode: currentMode,
                days: document.getElementById('days').value,
                lastDate: document.getElementById('lastDate').value,
                hours: document.getElementById('hours').value,
                minutes: document.getElementById('minutes').value,
                targetHours: document.getElementById('targetHours').value
            };
            localStorage.setItem('generator_neumo_data', JSON.stringify(data));
        }

        function loadSavedData() {
            const savedData = localStorage.getItem('generator_neumo_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                if (data.mode) setMode(data.mode);
                if (data.days) document.getElementById('days').value = data.days;
                if (data.lastDate) document.getElementById('lastDate').value = data.lastDate;
                if (data.hours) document.getElementById('hours').value = data.hours;
                if (data.minutes) document.getElementById('minutes').value = data.minutes;
                if (data.targetHours) document.getElementById('targetHours').value = data.targetHours;
            }
        }
    </script>
</body>
</html>
