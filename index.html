<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РАСЧЁТ МОТОЧАСОВ ГЕНЕРАТОРА</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #222222;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
            --reset-color: #dc3545;
            --reset-hover: #bd2130;
            --border-color: #cccccc;
            --result-bg: #e9ecef;
            --wm-bg: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            --wm-text: #555555;
            --wm-shadow: 0 4px 8px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            --wm-border: rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
            --font-size: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-size: var(--font-size);
            text-transform: uppercase;
            position: relative;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            padding-bottom: 45px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h2 {
            margin: 0;
            font-size: 1.3em;
        }

        .settings-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
            padding: 5px;
        }

        /* УВЕДОМЛЕНИЕ О СРОКЕ ТО (ПЕРЕД РЕЗУЛЬТАТАМИ) */
        .alert-banner {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 0.9em;
            text-align: center;
            display: none;
        }
        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--result-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            color: var(--text-color);
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.85em;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1em;
            box-sizing: border-box;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-transform: uppercase;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--reset-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .reset-btn:hover {
            background-color: var(--reset-hover);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--result-bg);
            border-radius: var(--border-radius);
            display: none;
        }

        .result-box h3 {
            margin-top: 0;
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .result-item {
            margin: 8px 0;
            font-size: 0.9em;
        }

        .highlight {
            font-weight: bold;
            color: var(--accent-color);
        }

        .highlight-alert {
            font-weight: bold;
            color: #d9534f;
        }

        /* 3D ВОДЯНОЙ ЗНАК В ПРЯМОУГОЛЬНИКЕ */
        .watermark-3d {
            position: absolute;
            bottom: 10px;
            left: 15px;
            padding: 4px 10px;
            font-size: 0.7em;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: var(--wm-bg);
            color: var(--wm-text);
            border: 1px solid var(--wm-border);
            border-radius: 6px;
            box-shadow: var(--wm-shadow);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
            user-select: none;
            pointer-events: none;
            display: inline-block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>ПОДСЧЁТ МОТОЧАСОВ</h2>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>

        <!-- БЛОК ПРЕДУПРЕЖДЕНИЯ ДЛЯ АНДРОИДА И ЭКРАНА -->
        <div id="alertBanner" class="alert-banner"></div>

        <div class="mode-selector">
            <button class="mode-btn active" id="btnModeDays" onclick="setMode('days')">ПО ДНЯМ</button>
            <button class="mode-btn" id="btnModeDate" onclick="setMode('date')">ПО ДАТЕ ТО</button>
        </div>

        <!-- РЕЖИМ 1: ПО КОЛИЧЕСТВУ ДНЕЙ -->
        <div id="sectionDays">
            <div class="input-group">
                <label for="days">КОЛИЧЕСТВО ДНЕЙ РАБОТЫ:</label>
                <input type="number" id="days" placeholder="НАПР. 5" min="0" oninput="autoCalculate()">
            </div>
        </div>

        <!-- РЕЖИМ 2: ПО ДАТЕ ПОСЛЕДНЕГО ТО -->
        <div id="sectionDate" style="display: none;">
            <div class="input-group">
                <label for="lastDate">ДАТА ПОСЛЕДНЕГО ТО:</label>
                <input type="date" id="lastDate" onchange="autoCalculate()">
            </div>
        </div>

        <div class="input-group">
            <label>ВРЕМЯ РАБОТЫ В ДЕНЬ:</label>
            <div class="time-inputs">
                <input type="number" id="hours" placeholder="ЧАСОВ (0-24)" min="0" max="24" oninput="autoCalculate()">
                <input type="number" id="minutes" placeholder="МИНУТ (0-59)" min="0" max="59" oninput="autoCalculate()">
            </div>
        </div>

        <div class="input-group">
            <label for="targetHours">КОЛ-ВО М/Ч ДО СЛЕД. ТО:</label>
            <input type="number" id="targetHours" placeholder="50" min="1" value="50" oninput="autoCalculate()">
        </div>

        <div class="action-btns">
            <button class="reset-btn" onclick="clearData()">ОЧИСТИТЬ</button>
        </div>

        <div class="result-box" id="result">
            <h3>РЕЗУЛЬТАТ:</h3>
            <div class="result-item" id="lastServiceDisplay"></div>
            <div class="result-item" id="daysPassed"></div>
            <div class="result-item" id="totalTime"></div>
            <div class="result-item" id="totalDecimal"></div>
            <div class="result-item" id="equivalentDays"></div>
            <div class="result-item" id="nextServiceDate"></div>
        </div>

        <!-- 3D ВОДЯНОЙ ЗНАК В ПРЯМОУГОЛЬНИКЕ -->
        <div class="watermark-3d">БЛiК</div>
    </div>

    <!-- ОКНО НАСТРОЕК ВНЕШНЕГО ВИДА -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>НАСТРОЙКИ ВНЕШНЕГО ВИДА</h3>
                <button class="close-btn" onclick="closeSettings()">✖</button>
            </div>

            <div class="input-group">
                <label for="themeSelect">ТЕМА ОФОРМЛЕНИЯ:</label>
                <select id="themeSelect" onchange="applySettings()">
                    <option value="light">СВЕТЛАЯ</option>
                    <option value="dark">ТЁМНАЯ</option>
                    <option value="blue">СИНЯЯ</option>
                </select>
            </div>

            <div class="input-group">
                <label for="fontSizeSelect">РАЗМЕР ШРИФТА:</label>
                <select id="fontSizeSelect" onchange="applySettings()">
                    <option value="14px">МАЛЕНЬКИЙ</option>
                    <option value="16px" selected>СРЕДНИЙ</option>
                    <option value="18px">БОЛЬШОЙ</option>
                </select>
            </div>

            <div class="input-group">
                <label for="radiusSelect">ЗАКРУГЛЕНИЕ УГЛОВ:</label>
                <select id="radiusSelect" onchange="applySettings()">
                    <option value="0px">ПРЯМЫЕ УГЛЫ</option>
                    <option value="8px">ЛЕГКОЕ</option>
                    <option value="16px" selected>СИЛЬНОЕ</option>
                </select>
            </div>

            <button class="reset-btn" style="background-color: var(--accent-color);" onclick="closeSettings()">СОХРАНИТЬ И ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        let currentMode = 'days';

        window.onload = function() {
            loadSavedData();
            applySettings();
            autoCalculate();
        };

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeDays').classList.toggle('active', mode === 'days');
            document.getElementById('btnModeDate').classList.toggle('active', mode === 'date');
            document.getElementById('sectionDays').style.display = mode === 'days' ? 'block' : 'none';
            document.getElementById('sectionDate').style.display = mode === 'date' ? 'block' : 'none';
            autoCalculate();
        }

        function formatDate(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}.${month}.${year}`;
        }

        function autoCalculate() {
            let totalDays = 0;
            let startDate = null;

            const hours = parseInt(document.getElementById('hours').value) || 0;
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const targetHours = parseFloat(document.getElementById('targetHours').value) || 50;

            const dailyMinutes = (hours * 60) + minutes;
            const banner = document.getElementById('alertBanner');

            if (dailyMinutes === 0 || hours > 24 || minutes >= 60 || targetHours <= 0) {
                document.getElementById('result').style.display = 'none';
                banner.style.display = 'none';
                saveData();
                return;
            }

            if (currentMode === 'days') {
                totalDays = parseInt(document.getElementById('days').value) || 0;
                startDate = new Date();
                startDate.setDate(startDate.getDate() - totalDays);
            } else {
                const dateVal = document.getElementById('lastDate').value;
                if (!dateVal) {
                    document.getElementById('result').style.display = 'none';
                    banner.style.display = 'none';
                    saveData();
                    return;
                }
                startDate = new Date(dateVal);
                const today = new Date();
                
                startDate.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);

                const diffTime = today - startDate;
                totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (totalDays < 0) {
                    document.getElementById('result').style.display = 'none';
                    banner.style.display = 'none';
                    saveData();
                    return;
                }
            }

            const totalMinutes = dailyMinutes * totalDays;
            const resHours = Math.floor(totalMinutes / 60);
            const resMinutes = totalMinutes % 60;
            const decimalHours = (totalMinutes / 60).toFixed(2);

            const continuousDays = Math.floor(resHours / 24);
            const remainingHours = resHours % 24;

            const dailyHours = dailyMinutes / 60;
            const daysNeededForTarget = Math.ceil(targetHours / dailyHours);

            const nextServiceDateObj = new Date(startDate);
            nextServiceDateObj.setDate(nextServiceDateObj.getDate() + daysNeededForTarget);

            // РАСЧЁТ ОСТАТКА ДНЕЙ ДО СЛЕДУЮЩЕГО ТО
            const todayTime = new Date();
            todayTime.setHours(0, 0, 0, 0);
            nextServiceDateObj.setHours(0, 0, 0, 0);
            
            const diffTimeRemaining = nextServiceDateObj - todayTime;
            const daysRemaining = Math.round(diffTimeRemaining / (1000 * 60 * 60 * 24));

            // ЛОГИКА ПРЕДУПРЕЖДЕНИЙ ЗА 2 И 1 ДЕНЬ
            if (daysRemaining < 0) {
                banner.className = "alert-banner alert-danger";
                banner.innerHTML = `⚠️ ВНИМАНИЕ! СРОК ТО ПРОШЕЛ ПРОШЛО СВЫШЕ ${targetHours} М/Ч!`;
                banner.style.display = "block";
            } else if (daysRemaining === 0) {
                banner.className = "alert-banner alert-danger";
                banner.innerHTML = `🚨 ВНИМАНИЕ! СЕГОДНЯ СРОК ПРОВЕДЕНИЯ ТО!`;
                banner.style.display = "block";
            } else if (daysRemaining === 1) {
                banner.className = "alert-banner alert-warning";
                banner.innerHTML = `⚠️ ПРЕДУПРЕЖДЕНИЕ: ДО СЛЕДУЮЩЕГО ТО ОСТАЛСЯ 1 ДЕНЬ!`;
                banner.style.display = "block";
            } else if (daysRemaining === 2) {
                banner.className = "alert-banner alert-warning";
                banner.innerHTML = `⚠️ ПРЕДУПРЕЖДЕНИЕ: ДО СЛЕДУЮЩЕГО ТО ОСТАЛОСЬ 2 ДНЯ!`;
                banner.style.display = "block";
            } else {
                banner.style.display = "none";
            }

            document.getElementById('lastServiceDisplay').innerHTML = 
                `ДАТА ПОСЛЕДНЕГО ТО: <span class="highlight">${formatDate(startDate)}</span>`;

            document.getElementById('daysPassed').innerHTML = 
                `ПРОШЛО ДНЕЙ: <span class="highlight">${totalDays} ДН.</span>`;

            document.getElementById('totalTime').innerHTML = 
                `ОБЩАЯ НАРАБОТКА: <span class="highlight">${resHours} Ч ${resMinutes} МИН</span>`;
            
            document.getElementById('totalDecimal').innerHTML = 
                `В ДЕСЯТИЧНОМ ВИДЕ: <span class="highlight">${decimalHours} МОТОЧАСОВ</span>`;

            document.getElementById('equivalentDays').innerHTML = 
                `НЕПРЕРЫВНАЯ РАБОТА: <span class="highlight">${continuousDays} ДН. ${remainingHours} Ч ${resMinutes} МИН</span>`;

            const isOverdue = resHours >= targetHours;
            const nextServiceClass = isOverdue ? 'highlight-alert' : 'highlight';
            const statusText = isOverdue ? ' (ТРЕБУЕТСЯ ТО!)' : '';

            document.getElementById('nextServiceDate').innerHTML = 
                `СЛЕДУЮЩЕЕ ТО (${targetHours} Ч): <span class="${nextServiceClass}">${formatDate(nextServiceDateObj)}${statusText}</span>`;

            document.getElementById('result').style.display = 'block';

            saveData();
        }

        function clearData() {
            document.getElementById('days').value = '';
            document.getElementById('lastDate').value = '';
            document.getElementById('hours').value = '';
            document.getElementById('minutes').value = '';
            document.getElementById('targetHours').value = '50';
            document.getElementById('result').style.display = 'none';
            document.getElementById('alertBanner').style.display = 'none';

            localStorage.removeItem('generator_data');
            saveData();
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
            saveData();
        }

        function applySettings() {
            const theme = document.getElementById('themeSelect').value;
            const fontSize = document.getElementById('fontSizeSelect').value;
            const radius = document.getElementById('radiusSelect').value;

            document.documentElement.style.setProperty('--font-size', fontSize);
            document.documentElement.style.setProperty('--border-radius', radius);

            if (theme === 'dark') {
                document.documentElement.style.setProperty('--bg-color', '#1e1e1e');
                document.documentElement.style.setProperty('--card-bg', '#2d2d2d');
                document.documentElement.style.setProperty('--text-color', '#ffffff');
                document.documentElement.style.setProperty('--border-color', '#444444');
                document.documentElement.style.setProperty('--result-bg', '#3a3a3a');
                document.documentElement.style.setProperty('--accent-color', '#ff9800');
                document.documentElement.style.setProperty('--accent-hover', '#e68a00');
                document.documentElement.style.setProperty('--wm-bg', 'linear-gradient(135deg, #3d3d3d 0%, #1a1a1a 100%)');
                document.documentElement.style.setProperty('--wm-text', '#ff9800');
                document.documentElement.style.setProperty('--wm-shadow', '0 4px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1)');
                document.documentElement.style.setProperty('--wm-border', 'rgba(255, 255, 255, 0.1)');
            } else if (theme === 'blue') {
                document.documentElement.style.setProperty('--bg-color', '#e3f2fd');
                document.documentElement.style.setProperty('--card-bg', '#ffffff');
                document.documentElement.style.setProperty('--text-color', '#0d47a1');
                document.documentElement.style.setProperty('--border-color', '#90caf9');
                document.documentElement.style.setProperty('--result-bg', '#bbdefb');
                document.documentElement.style.setProperty('--accent-color', '#1976d2');
                document.documentElement.style.setProperty('--accent-hover', '#1565c0');
                document.documentElement.style.setProperty('--wm-bg', 'linear-gradient(135deg, #ffffff 0%, #bbdefb 100%)');
                document.documentElement.style.setProperty('--wm-text', '#1565c0');
                document.documentElement.style.setProperty('--wm-shadow', '0 4px 8px rgba(25, 118, 210, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.9)');
                document.documentElement.style.setProperty('--wm-border', 'rgba(25, 118, 210, 0.2)');
            } else {
                document.documentElement.style.setProperty('--bg-color', '#f4f7f6');
                document.documentElement.style.setProperty('--card-bg', '#ffffff');
                document.documentElement.style.setProperty('--text-color', '#222222');
                document.documentElement.style.setProperty('--border-color', '#cccccc');
                document.documentElement.style.setProperty('--result-bg', '#e9ecef');
                document.documentElement.style.setProperty('--accent-color', '#007bff');
                document.documentElement.style.setProperty('--accent-hover', '#0056b3');
                document.documentElement.style.setProperty('--wm-bg', 'linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%)');
                document.documentElement.style.setProperty('--wm-text', '#555555');
                document.documentElement.style.setProperty('--wm-shadow', '0 4px 8px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8)');
                document.documentElement.style.setProperty('--wm-border', 'rgba(0, 0, 0, 0.1)');
            }
        }

        function saveData() {
            const data = {
                mode: currentMode,
                days: document.getElementById('days').value,
                lastDate: document.getElementById('lastDate').value,
                hours: document.getElementById('hours').value,
                minutes: document.getElementById('minutes').value,
                targetHours: document.getElementById('targetHours').value,
                theme: document.getElementById('themeSelect').value,
                fontSize: document.getElementById('fontSizeSelect').value,
                radius: document.getElementById('radiusSelect').value
            };
            localStorage.setItem('generator_data', JSON.stringify(data));
        }

        function loadSavedData() {
            const savedData = localStorage.getItem('generator_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                if (data.mode) setMode(data.mode);
                if (data.days) document.getElementById('days').value = data.days;
                if (data.lastDate) document.getElementById('lastDate').value = data.lastDate;
                if (data.hours) document.getElementById('hours').value = data.hours;
                if (data.minutes) document.getElementById('minutes').value = data.minutes;
                if (data.targetHours) document.getElementById('targetHours').value = data.targetHours;
                if (data.theme) document.getElementById('themeSelect').value = data.theme;
                if (data.fontSize) document.getElementById('fontSizeSelect').value = data.fontSize;
                if (data.radius) document.getElementById('radiusSelect').value = data.radius;
            }
        }
    </script>
</body>
</html>
