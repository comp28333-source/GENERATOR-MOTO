<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БЛiК — Учет и Мониторинг</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #4a5568;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #3182ce;
            --accent-red: #e53e3e;
            --input-bg: #e0e5ec;
            --badge-bg: #fff5f5;
            --result-bg: #ebf8ff;
            --result-border: #3182ce;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --shadow-light: #2d3748;
            --shadow-dark: #0f141c;
            --accent: #63b3ed;
            --accent-red: #fc8181;
            --input-bg: #1a202c;
            --badge-bg: #2d3748;
            --result-bg: #2b6cb033;
            --result-border: #63b3ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Водяной знак БЛiК на фоне */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20vw;
            font-weight: 900;
            color: var(--text-color);
            opacity: 0.04;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 10px;
        }

        /* Верхняя панель: Переключатель тем и выбор разделов */
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-toggle, .nav-btn {
            background: var(--bg-color);
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .theme-toggle:active, .nav-btn:active, .nav-btn.active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent);
        }

        .nav-container {
            display: flex;
            gap: 10px;
        }

        /* Основная карточка */
        .card {
            background: var(--bg-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Скрываем неактивные разделы */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Предупреждение о ТО */
        .alert-box {
            background: var(--badge-bg);
            border-left: 5px solid var(--accent-red);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-red);
            margin-bottom: 20px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            display: none;
        }
        .alert-box.visible {
            display: block;
        }

        /* Подменю выбора метода подсчета */
        .sub-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sub-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.8rem;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }

        .sub-btn.active {
            background: var(--accent);
            color: #ffffff;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            opacity: 0.8;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            outline: none;
            font-size: 0.95rem;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--accent-red);
            font-weight: bold;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer;
            letter-spacing: 1px;
        }

        .action-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        /* Выделенный яркий блок результатов (как плашка предупреждения) */
        .result-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            background: var(--result-bg);
            border-left: 5px solid var(--result-border);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .result-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
        }

        .result-big-stat {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Водяной знак БЛiК -->
    <div class="watermark">БЛiК</div>

    <div class="app-wrapper">
        <!-- Верхняя панель -->
        <div class="top-panel">
            <div class="nav-container">
                <button class="nav-btn active" onclick="switchMainTab('hours', this)">МОТОЧАСЫ, Т/О</button>
                <button class="nav-btn" onclick="switchMainTab('fuel', this)">ТОПЛИВО</button>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>

        <!-- Карточка -->
        <div class="card">
            
            <!-- РАЗДЕЛ 1: МОТОЧАСЫ, Т/О -->
            <div id="hours" class="tab-content active">
                <div class="card-header">
                    <div class="section-title">ПОДСЧЁТ МОТОЧАСОВ</div>
                </div>

                <!-- Предупреждение о ТО -->
                <div id="alertBox" class="alert-box">
                    🚨 ВНИМАНИЕ! СЕГОДНЯ СРОК ПРОВЕДЕНИЯ ТО!
                </div>

                <!-- Подменю -->
                <div class="sub-nav">
                    <button class="sub-btn active" id="btnDays" onclick="setMode('days')">ПО ДНЯМ</button>
                    <button class="sub-btn" id="btnDate" onclick="setMode('date')">ПО ДАТЕ ТО</button>
                </div>

                <div class="form-group">
                    <label>Дата последнего ТО:</label>
                    <input type="date" id="lastToDate" onchange="calculateHours()">
                </div>

                <div class="form-group" id="dynamicInputGroup">
                    <label id="dynamicLabel">Время работы в день:</label>
                    <div id="inputContainer" class="row-inputs">
                        <input type="number" id="hoursPerDay" value="3" min="0" oninput="calculateHours()">
                        <input type="number" id="minutesPerDay" value="30" min="0" max="59" oninput="calculateHours()">
                    </div>
                </div>

                <div class="form-group">
                    <label id="limitLabel">Кол-во м/ч до след. ТО:</label>
                    <input type="number" id="toLimit" value="50" min="1" oninput="calculateHours()">
                </div>

                <button class="action-btn" onclick="clearForm()">ОЧИСТИТЬ</button>

                <!-- ВЫДЕЛЕННЫЙ БЛОК РЕЗУЛЬТАТОВ -->
                <div class="result-box">
                    <div class="result-title">РЕЗУЛЬТАТ:</div>
                    <div>ДАТА ПОСЛЕДНЕГО ТО: <span id="resLastDate" class="result-value">-</span></div>
                    <div>ПРОШЛО ДНЕЙ: <span id="resDaysPassed" class="result-value">-</span></div>
                    <div style="margin-top: 5px;">ОБЩАЯ НАРАБОТКА:</div>
                    <div id="resTotalTime" class="result-big-stat">-</div>
                    <div>В ДЕСЯТИЧНОМ ВИДЕ: <span id="resDecimal" class="result-value">-</span> М/Ч</div>
                    <div>НЕПРЕРЫВНАЯ РАБОТА: <span id="resContinuous" class="result-value">-</span></div>
                    <div style="margin-top: 8px;">СЛЕДУЮЩЕЕ ТО (<span id="resLimitVal">50</span> Ч): <br><span id="resNextToDate" class="result-value" style="font-size: 1.1rem;">-</span></div>
                </div>
            </div>

            <!-- РАЗДЕЛ 2: РАСХОД ТОПЛИВА -->
            <div id="fuel" class="tab-content">
                <div class="card-header">
                    <div class="section-title">РАСХОД ТОПЛИВА</div>
                </div>
                <div class="form-group">
                    <label>С даты:</label>
                    <input type="date" id="fuelStart">
                </div>
                <div class="form-group">
                    <label>По текущую:</label>
                    <input type="date" id="fuelEnd">
                </div>
                <div class="form-group">
                    <label>Литров в день:</label>
                    <input type="number" id="fuelPerDay" value="7">
                </div>
                <button class="action-btn" style="color: var(--accent);" onclick="calculateFuel()">РАССЧИТАТЬ</button>
                
                <!-- ВЫДЕЛЕННЫЙ БЛОК РЕЗУЛЬТАТОВ ТОПЛИВА -->
                <div class="result-box" style="text-align: center;">
                    <div class="result-title">РЕЗУЛЬТАТ</div>
                    <div id="fuelTotal" class="result-big-stat">-</div>
                    <div id="fuelPeriod" style="font-size: 0.9rem; opacity: 0.85; font-weight: 600;">Период: - дн.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentMode = 'days';

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.top-panel .nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function setMode(mode) {
            currentMode = mode;
            const btnDays = document.getElementById('btnDays');
            const btnDate = document.getElementById('btnDate');
            const dynLabel = document.getElementById('dynamicLabel');
            const inputContainer = document.getElementById('inputContainer');
            const limitLabel = document.getElementById('limitLabel');

            if (mode === 'days') {
                btnDays.classList.add('active');
                btnDate.classList.remove('active');
                dynLabel.innerText = "Время работы в день:";
                inputContainer.innerHTML = `
                    <input type="number" id="hoursPerDay" value="3" min="0" oninput="calculateHours()">
                    <input type="number" id="minutesPerDay" value="30" min="0" max="59" oninput="calculateHours()">
                `;
                limitLabel.innerText = "Кол-во м/ч до след. ТО:";
            } else {
                btnDate.classList.add('active');
                btnDays.classList.remove('active');
                dynLabel.innerText = "Планируемая дата ТО:";
                inputContainer.innerHTML = `
                    <input type="date" id="targetToDate" onchange="calculateHours()">
                `;
                limitLabel.innerText = "Интервал ТО (м/ч):";
                const targetDef = new Date();
                targetDef.setDate(targetDef.getDate() + 15);
                document.getElementById('targetToDate').valueAsDate = targetDef;
            }
            calculateHours();
        }

        function clearForm() {
            document.getElementById('lastToDate').valueAsDate = new Date();
            document.getElementById('toLimit').value = 50;
            if (currentMode === 'days') {
                document.getElementById('hoursPerDay').value = 3;
                document.getElementById('minutesPerDay').value = 30;
            } else {
                const targetDef = new Date();
                targetDef.setDate(targetDef.getDate() + 15);
                document.getElementById('targetToDate').valueAsDate = targetDef;
            }
            calculateHours();
        }

        function calculateHours() {
            const lastDateVal = document.getElementById('lastToDate').value;
            const limitVal = parseFloat(document.getElementById('toLimit').value) || 50;
            
            if (!lastDateVal) return;

            const lastDate = new Date(lastDateVal);
            const today = new Date();
            today.setHours(0,0,0,0);
            lastDate.setHours(0,0,0,0);

            const diffTime = today - lastDate;
            let daysPassed = Math.round(diffTime / (1000 * 60 * 60 * 24));
            if (daysPassed < 0) daysPassed = 0;

            let totalMinutes = 0;
            let totalHoursDecimal = 0;

            if (currentMode === 'days') {
                const hPD = parseFloat(document.getElementById('hoursPerDay').value) || 0;
                const mPD = parseFloat(document.getElementById('minutesPerDay').value) || 0;
                const dailyMinutes = (hPD * 60) + mPD;
                
                totalMinutes = daysPassed * dailyMinutes;
                totalHoursDecimal = totalMinutes / 60;
            } else {
                const targetDateVal = document.getElementById('targetToDate').value;
                if (targetDateVal) {
                    const targetDate = new Date(targetDateVal);
                    targetDate.setHours(0,0,0,0);
                    let totalSpanDays = Math.round((targetDate - lastDate) / (1000 * 60 * 60 * 24));
                    if (totalSpanDays < 1) totalSpanDays = 1;
                    
                    totalHoursDecimal = (limitVal / totalSpanDays) * daysPassed;
                    if (totalHoursDecimal > limitVal) totalHoursDecimal = limitVal;
                    totalMinutes = Math.round(totalHoursDecimal * 60);
                }
            }

            const resH = Math.floor(totalMinutes / 60);
            const resM = totalMinutes % 60;

            const contDays = Math.floor(resH / 24);
            const contRemH = resH % 24;

            let nextToDateStr = "-";
            if (currentMode === 'days') {
                const hPD = parseFloat(document.getElementById('hoursPerDay').value) || 0;
                const mPD = parseFloat(document.getElementById('minutesPerDay').value) || 0;
                const dailyHours = hPD + (mPD / 60);
                
                if (dailyHours > 0) {
                    const hoursNeeded = limitVal;
                    const daysNeededToLimit = Math.ceil(hoursNeeded / dailyHours);
                    const nextDate = new Date(lastDate);
                    nextDate.setDate(nextDate.getDate() + daysNeededToLimit);
                    nextToDateStr = nextDate.toLocaleDateString('ru-RU');
                }
            } else {
                const targetDateVal = document.getElementById('targetToDate').value;
                if (targetDateVal) {
                    nextToDateStr = new Date(targetDateVal).toLocaleDateString('ru-RU');
                }
            }

            document.getElementById('resLastDate').innerText = lastDate.toLocaleDateString('ru-RU');
            document.getElementById('resDaysPassed').innerText = `${daysPassed} ДН.`;
            document.getElementById('resTotalTime').innerText = `${resH} Ч ${resM} МИН`;
            document.getElementById('resDecimal').innerText = totalHoursDecimal.toFixed(2);
            document.getElementById('resContinuous').innerText = `${contDays} ДН. ${contRemH} Ч ${resM} МИН`;
            document.getElementById('resLimitVal').innerText = limitVal;
            document.getElementById('resNextToDate').innerText = nextToDateStr;

            const alertBox = document.getElementById('alertBox');
            if (totalHoursDecimal >= limitVal) {
                alertBox.classList.add('visible');
                document.getElementById('resNextToDate').style.color = "var(--accent-red)";
                document.getElementById('resNextToDate').innerText += " (ТРЕБУЕТСЯ ТО!)";
            } else {
                alertBox.classList.remove('visible');
                document.getElementById('resNextToDate').style.color = "var(--accent)";
            }
        }

        const initialLastDate = new Date();
        initialLastDate.setDate(initialLastDate.getDate() - 15);
        document.getElementById('lastToDate').valueAsDate = initialLastDate;
        
        document.getElementById('fuelEnd').valueAsDate = new Date();
        const fuelStartDef = new Date();
        fuelStartDef.setDate(fuelStartDef.getDate() - 5);
        document.getElementById('fuelStart').valueAsDate = fuelStartDef;
        calculateFuel();

        function calculateFuel() {
            const start = new Date(document.getElementById('fuelStart').value);
            const end = new Date(document.getElementById('fuelEnd').value);
            const lPD = parseFloat(document.getElementById('fuelPerDay').value) || 0;
            if (start && end && end >= start) {
                const days = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('fuelTotal').innerText = `${days * lPD} Л`;
                document.getElementById('fuelPeriod').innerText = `Период: ${days} дн.`;
            }
        }

        calculateHours();
    </script>
</body>
</html>
